<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/vite.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tetris-Vibe | Survival Terminated</title>
  <style>
    body {
      margin: 0;
      background: #050505;
      color: #00faff;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      overflow: hidden;
    }
  </style>
</head>

<body>
  <div id="app">
    <!-- Canvas will be injected here by CanvasRenderer -->

    <div id="ui-layer">
      <!-- HUD Top -->
      <div class="hud-top">
        <div class="stat-panel">
          <div class="label">SCORE</div>
          <div class="value" id="score-value">0</div>
        </div>
        <div class="stat-panel">
          <div class="label">LEVEL</div>
          <div class="value" id="level-value">1</div>
        </div>
      </div>

      <!-- HUD Side -->
      <div class="hud-side">
        <div class="stat-panel">
          <div class="label">LINES</div>
          <div class="value" id="lines-value">0</div>
        </div>
        <!-- Future: Next Piece -->
      </div>

      <!-- Overlays -->
      <div id="overlay-pause" class="overlay hidden">
        <div class="modal">
          <h1>PAUSED</h1>
          <p>Press ESC to Resume</p>
        </div>
      </div>

      <div id="overlay-gameover" class="overlay hidden">
        <div class="modal">
          <h1>SYSTEM FAILURE</h1>
          <p>Final Score: <span id="final-score">0</span></p>
          <div class="actions">
            <button id="btn-restart">REBOOT SYSTEM</button>
          </div>
        </div>
      </div>

      <!-- Notifications -->
      <div id="toast-container"></div>
    </div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>

</html>
